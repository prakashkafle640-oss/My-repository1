<!DOCTYPE html>
<html>
<head>
    <title>My Hotel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-button {
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
        }

        #menu {
            display: none;
            margin-top: 15px;
        }

        #menu a {
            display: block;
            text-decoration: none;
            margin: 10px 0;
        }

        .hotel-photo {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>My Hotel</h1>

        <button class="menu-button" onclick="toggleMenu()">☰</button>
    </div>

    <div id="menu">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
    </div>

    <p>
        Welcome to our beautiful hotel.
        Enjoy comfortable rooms, delicious food, and friendly service.
    </p>

    <img
        class="hotel-photo"
        src="images/hotel.jpg"
        alt="Hotel exterior"
    >

    <script>
        function toggleMenu() {
            const menu = document.getElementById("menu");

            if (menu.style.display === "none") {
                menu.style.display = "block";
            } else {
                menu.style.display = "none";
            }
        }
    </script>

</body>
                                                              </html>
